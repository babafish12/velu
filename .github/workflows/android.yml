name: Android build and JVM checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned compile platform
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Check release metadata tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Run JVM tests, lint and build
        run: ./gradlew --no-daemon --console=plain --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Save JVM and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jvm-and-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
      - name: Save development-only APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-apk-not-an-official-update
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

# CI has no release signing key and never publishes an update asset.
# Its automatically generated debug signer is NOT update-compatible with official APKs.
# Android device/instrumentation and real-account checks are separate from this job.
